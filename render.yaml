services:
  - type: web
    name: etoro-paper-scanner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.enableCORS=false --server.enableWebsocketCompression=false
    healthCheckPath: /_stcore/health
    disk:
      name: scanner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.8
      - key: ETORO_API_KEY
        sync: false
      - key: ETORO_USER_KEY
        sync: false
      - key: ETORO_TRADING_MODE
        value: demo
      - key: DATABASE_PATH
        value: /var/data/scanner.sqlite3
      - key: POLL_SECONDS
        value: "60"
      - key: UNIVERSE_LIMIT
        value: "100"
      - key: ANALYSIS_REFRESH_SECONDS
        value: "1800"
      - key: CANDLES_PER_CYCLE
        value: "3"
      - key: PORTFOLIO_REFRESH_SECONDS
        value: "300"
      - key: RISK_PER_TRADE_PCT
        value: "0.5"
      - key: MAX_POSITION_PCT
        value: "5"
